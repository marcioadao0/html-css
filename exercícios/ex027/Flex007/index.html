<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        .container {
            background-color: gray;
            display: flex;
        }

        .item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
            
    
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" style="order: 0;">A</div>
        <div class="item" style="order: -2;">B</div>
        <div class="item" style="order: 0;">C</div>
        <div class="item" style="order: 5;">D</div>
        <div class="item" style="order: -8;">E</div>
        <div class="item" style="order: 2;">F</div>
        <div class="item" style="order: 0;">G</div>
    </div>
</body>
</html>
